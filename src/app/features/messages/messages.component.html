<div class="page-container">
  <h1 class="section-title">Message History</h1>

  @if (errorMessage) {
    <div class="error-banner">{{ errorMessage }}</div>
  }

  @if (loading) {
    <mat-spinner diameter="40" />
  } @else if (messages.length === 0) {
    <div class="empty-state">No messages sent yet.</div>
  } @else {
    <table mat-table [dataSource]="messages">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let msg">{{ msg.id }}</td>
      </ng-container>

      <ng-container matColumnDef="categoryName">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let msg">{{ msg.categoryName }}</td>
      </ng-container>

      <ng-container matColumnDef="body">
        <th mat-header-cell *matHeaderCellDef>Message</th>
        <td mat-cell *matCellDef="let msg">{{ truncate(msg.body) }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let msg">{{ msg.createdAt | date:'dd/MM/yyyy HH:mm:ss' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let msg">
          <a mat-button color="primary" [routerLink]="['/logs']" [queryParams]="{ messageId: msg.id }">
            View Logs
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
